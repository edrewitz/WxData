<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Left Side Menu -->
    <div class="sidebar">
        <h2>Menu</h2>
        <a href="#home">Home</a>
        <a href="#about">About</a>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <h1>WxData: A Python package that helps users retrieve and process weather data.</h1>
        <p>This is where your main text or content goes.</p>
    </div>

    <script>
        // 1. Request the file from your server/folder
        fetch('README.md')
            .then(response => {
                if (!response.ok) throw new Error('File not found');
                return response.text();
            })
            .then(markdownText => {
                // 2. Parse the file contents into HTML and update the page
                document.getElementById('markdown-target').innerHTML = marked.parse(markdownText);
            })
            .catch(error => {
                document.getElementById('markdown-target').innerHTML = "Error loading content.";
                console.error(error);
            });
    </script>

</body>
</html>
