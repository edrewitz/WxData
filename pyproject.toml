[project]
name = "wxdata"
version = "3.0"
description = "A Python package of end-to-end weather data clients & raw data clients with VPN/Proxy Server support, data processors that decode variable keys from GRIB format into a plain-language format & various tools for assisting Python automated workflows, querying meteorological datasets and filling gaps in meteorological data."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE*"]
authors = [
    { name = "Eric J. Drewitz" },
]
keywords = ["meteorology", "atmospheric sciences"]
classifiers = [
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent",
]

dependencies = [
  "metpy>=1.7.1",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "cartopy>=0.25.0",
  "xarray>=2025.6.1",
  "netcdf4>=1.7.3",
  "shapeography>=1.2",
  "beautifulsoup4>=4.14.3",
  "requests>=2.32.5",
  "cfgrib>=0.9.15.1",
  "dask>=2025.11.0",
  "tqdm>=4.67.3",
  "openpyxl>=3.1.5",
  "arm-pyart>=2.2.0",
  "click>=8.3.1",
 
]

[project.scripts]
wxdata-rtma = "wxdata.rtma_cli:main"
wxdata-cfs = "wxdata.cfs_cli:main"
wxdata-gfs = "wxdata.gfs_cli:main"
wxdata-gefs = "wxdata.gefs_cli:main"
wxdata-aigefs = "wxdata.aigefs_cli:main"
wxdata-aigfs = "wxdata.aigfs_cli:main"
wxdata-hgefs = "wxdata.hgefs_cli:main"
wxdata-ecmwf = "wxdata.ecmwf_cli:main"
wxdata-cansips = "wxdata.cansips_cli:main"
wxdata-gdps = "wxdata.gdps_cli:main"
wxdata-geps = "wxdata.geps_cli:main"
wxdata-ndfd = "wxdata.ndfd_cli:main"
wxdata-soundings = "wxdata.soundings_cli:main"
wxdata-metars = "wxdata.metars_cli:main"
wxdata-nexrad2 = "wxdata.nexrad2_cli:main"

[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # Look for packages in the src directory

[project.urls]
Documentation = "https://edrewitz.github.io/WxData/"
Repository = "https://github.com/edrewitz/wxdata/tree/main"
